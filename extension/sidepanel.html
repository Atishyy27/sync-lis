<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>

  <!-- before a room exists -->
  <section id="door" class="door">
    <div class="mark">sync&#8209;<b>lis</b></div>
    <p>Open what you want to watch in this tab, then start a room and send the link. Whatever you play, they play.</p>
    <input id="nameInput" type="text" maxlength="24" placeholder="your name" autocomplete="off" />
    <button id="createBtn" class="go">Start a room</button>
    <div class="or"><span>or join</span></div>
    <input id="codeInput" type="text" placeholder="paste the room link" autocomplete="off" />
    <button id="joinBtn" class="chip" style="text-align:center">Join</button>
    <p id="doorErr" class="err hidden"></p>
  </section>

  <!-- the room -->
  <main id="live" class="hidden">
    <section class="state">
      <div id="stateLine" class="state-line">nothing playing</div>
      <div id="stateWhy" class="state-why"></div>
      <div id="track" class="track"></div>
      <div class="track-ends">
        <span id="tNow">0:00</span>
        <span id="tRate"></span>
      </div>
    </section>

    <section class="playing">
      <div class="eyebrow">playing</div>
      <div id="title" class="title empty">nothing yet</div>
    </section>

    <section id="people" class="people"></section>

    <div id="stream" class="stream"></div>
    <div id="typing" class="typing"></div>

    <div class="composer">
      <div class="field">
        <input id="msg" type="text" maxlength="500" placeholder="say something" autocomplete="off" />
        <button id="more" title="more">+</button>
        <button id="send" title="send">↵</button>
      </div>
      <div id="drawer" class="drawer hidden"></div>
    </div>
  </main>

  <!-- room settings, one level down -->
  <section id="sheet" class="sheet hidden">
    <div class="sheet-head">
      <h2>Room</h2>
      <button id="sheetClose" class="chip">Close</button>
    </div>
    <div class="sheet-body">
      <div class="block">
        <div class="eyebrow">invite</div>
        <div class="copyfield">
          <input id="linkBox" type="text" readonly />
          <button id="copyBtn" class="chip">Copy</button>
        </div>
      </div>

      <div class="block">
        <div class="eyebrow">you</div>
        <div class="copyfield">
          <input id="meName" type="text" maxlength="24" placeholder="your name" autocomplete="off" style="color:var(--text);font-family:var(--sans);font-size:12px" />
          <button id="saveMe" class="chip">Save</button>
        </div>
        <div id="faces" class="faces"></div>
      </div>

      <div class="block">
        <div class="eyebrow">controls</div>
        <div class="drawer-row">
          <button id="readyBtn" class="chip">Ready</button>
          <button id="lockBtn" class="chip">Lock controls</button>
          <button id="voiceBtn" class="chip">Voice</button>
          <button id="muteBtn" class="chip hidden">Mute</button>
        </div>
      </div>

      <div class="block">
        <button id="leaveBtn" class="chip warn">Leave room</button>
      </div>
    </div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
