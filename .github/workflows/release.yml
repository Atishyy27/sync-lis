# Push a v* tag, get a Release with the installable extension attached.
#
#   npm version 1.0.1 --no-git-tag-version   # bumps package.json
#   git tag v1.0.1 && git push origin v1.0.1
#
# The zip is built here rather than on a laptop so what ships is always what
# is at the tag, never whatever happened to be in the working tree.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from the commit range

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The tag and the manifest have to agree, or people install a build whose
      # version does not match the release they downloaded it from.
      - name: Tag must match manifest version
        run: |
          manifest=$(node -p "require('./extension/manifest.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag v$tag but extension/manifest.json says $manifest" >&2
            exit 1
          fi

      - run: npm run pack

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/sync-lis-v*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
